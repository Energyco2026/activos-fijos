<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Activos Fijos · ENERGYCONTROL</title>
<style>
  :root{
    --ink:#14202b;
    --steel:#3c5266;
    --steel-light:#6c8194;
    --line:#d7dee4;
    --panel:#ffffff;
    --bg:#eef1f4;
    --amber:#b45309;
    --amber-bg:#fdf3e7;
    --ok:#1f6e4f;
    --ok-bg:#e8f4ee;
    --accent:#1f4e78;
    --mono:'SFMono-Regular', Consolas, monospace;
    --sans:'Segoe UI', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:var(--sans); background:var(--bg); color:var(--ink);}

  header{
    background:var(--ink); color:#fff; padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{ font-size:17px; margin:0; font-weight:600; }
  header .sub{ font-size:12px; color:#9fb0bf; margin-top:2px; }
  header button{
    background:var(--accent); color:#fff; border:none; border-radius:4px;
    padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer;
  }
  header button:hover{ background:#245a8c; }

  main{ max-width:1100px; margin:0 auto; padding:20px; }

  .toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar input{
    flex:1; min-width:200px; padding:9px 12px; border:1px solid var(--line);
    border-radius:4px; font-size:13px;
  }

  table{ width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); }
  th, td{ padding:10px 12px; text-align:left; font-size:13px; border-bottom:1px solid var(--line); }
  th{ background:#f5f7f9; font-size:11px; text-transform:none; color:var(--steel-light); font-weight:600; }
  tr:hover td{ background:#f9fafb; }
  td.codigo{ font-family:var(--mono); font-weight:600; }
  .estado-pill{ font-size:11px; font-weight:600; padding:3px 8px; border-radius:3px; background:var(--ok-bg); color:var(--ok); display:inline-block; }
  .estado-pill.baja{ background:var(--amber-bg); color:var(--amber); }
  .row-actions button{
    border:1px solid var(--line); background:#fff; border-radius:4px; padding:5px 9px;
    font-size:12px; cursor:pointer; margin-right:4px;
  }
  .row-actions button:hover{ background:#f0f2f4; }
  .row-actions button.qr{ color:var(--accent); border-color:var(--accent); }

  /* Modal */
  .overlay{
    display:none; position:fixed; inset:0; background:rgba(20,32,43,.55);
    align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; z-index:50;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:#fff; border-radius:6px; width:100%; max-width:620px; padding:22px 24px 26px;
  }
  .modal h2{ font-size:16px; margin:0 0 16px 0; }
  .modal .close{ float:right; cursor:pointer; font-size:18px; color:var(--steel-light); border:none; background:none; }

  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
  .field-grid .full{ grid-column:1/-1; }
  .field label{ font-size:11.5px; color:var(--steel-light); display:block; margin-bottom:4px; }
  .field input, .field select, .field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:4px; font-size:13px; font-family:inherit;
  }
  .field textarea{ min-height:56px; resize:vertical; }

  .section-title{ font-size:12px; font-weight:700; color:var(--accent); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.02em; }

  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .btn{ border:none; border-radius:4px; padding:9px 18px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.ghost{ background:#f0f2f4; color:var(--ink); }
  .btn.danger{ background:#fdecec; color:#b3261e; }

  /* QR modal */
  #qr-modal .modal{ max-width:380px; text-align:center; }
  #qr-canvas-wrap{ margin:14px 0; display:flex; justify-content:center; }
  #qr-canvas-wrap canvas{ border:1px solid var(--line); }
  #qrcode-src{ display:none; }
  .qr-url{ font-size:11px; color:var(--steel-light); word-break:break-all; margin-top:6px; }

  .empty{ text-align:center; padding:40px; color:var(--steel-light); font-size:13px; }
</style>
</head>

<main>
  <div class="toolbar">
    <input type="text" id="buscador" placeholder="Buscar por código, responsable, marca o modelo…" oninput="renderTabla()">
  </div>

  <table>
    <thead>
      <tr>
        <th>Código</th>
        <th>Tipo</th>
        <th>Marca / Modelo</th>
        <th>Responsable</th>
        <th>Estado</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>

<!-- Modal de edición/creación -->
<div class="overlay" id="form-overlay">
  <div class="modal">
    <button class="close" onclick="cerrarModal()">✕</button>
    <h2 id="form-title">Nuevo activo</h2>
    <form id="activo-form">
      <input type="hidden" id="f-id">

      <div class="section-title">Identificación</div>
      <div class="field-grid">
        <div class="field"><label>Código de activo</label><input id="f-codigo" required placeholder="EC-000020"></div>
        <div class="field"><label>Tipo de activo</label><input id="f-tipo" placeholder="Laptop, Monitor, CPU…"></div>
        <div class="field"><label>Marca</label><input id="f-marca"></div>
        <div class="field"><label>Modelo</label><input id="f-modelo"></div>
        <div class="field"><label>Color</label><input id="f-color"></div>
        <div class="field"><label>Serie / SN</label><input id="f-serie"></div>
      </div>

      <div class="section-title">Responsable y ubicación</div>
      <div class="field-grid">
        <div class="field full"><label>Responsable actual</label><input id="f-responsable"></div>
        <div class="field"><label>Cédula</label><input id="f-cedula"></div>
        <div class="field"><label>Ubicación</label><input id="f-ubicacion"></div>
        <div class="field"><label>Estado</label>
          <select id="f-estado">
            <option>Asignado</option>
            <option>Disponible</option>
            <option>En reparación</option>
            <option>Baja</option>
          </select>
        </div>
        <div class="field"><label>Fecha última entrega</label><input type="date" id="f-fecha"></div>
      </div>

      <div class="section-title">Información de compra</div>
      <div class="field-grid">
        <div class="field"><label>Proveedor</label><input id="f-proveedor"></div>
        <div class="field"><label>Factura</label><input id="f-factura"></div>
        <div class="field"><label>Valor de compra</label><input type="number" step="0.01" id="f-valor"></div>
        <div class="field"><label>Garantía</label><input id="f-garantia"></div>
      </div>

      <div class="section-title">Detalle técnico e historial</div>
      <div class="field-grid">
        <div class="field full"><label>Especificaciones técnicas</label><textarea id="f-specs"></textarea></div>
        <div class="field"><label>Estado físico</label><input id="f-estadofisico"></div>
        <div class="field"><label>Fuente (acta / factura)</label><input id="f-fuente"></div>
        <div class="field full"><label>Historial</label><textarea id="f-historial"></textarea></div>
        <div class="field full"><label>Observaciones</label><textarea id="f-observaciones"></textarea></div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn danger" id="btn-eliminar" style="display:none;" onclick="eliminarActivo()">Eliminar</button>
        <button type="button" class="btn ghost" onclick="cerrarModal()">Cancelar</button>
        <button type="submit" class="btn primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

  let activos = [];

  async function cargarActivos(){
    const { data, error } = await sb.from('activos_fijos').select('*').order('codigo');
    if (error){ alert('Error cargando activos: ' + error.message); return; }
    activos = data;
    document.getElementById('contador-sub').textContent = `${activos.length} activos registrados`;
    renderTabla();
  }

  function renderTabla(){
    const q = document.getElementById('buscador').value.trim().toLowerCase();
    const filtrados = activos.filter(a =>
      !q || [a.codigo, a.responsable_actual, a.marca, a.modelo, a.tipo_activo]
        .some(v => (v||'').toLowerCase().includes(q))
    );
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    document.getElementById('empty-msg').style.display = filtrados.length ? 'none' : 'block';
    for (const a of filtrados){
      const tr = document.createElement('tr');
      const esBaja = ['Baja','En reparación','Disponible'].includes(a.estado);
      tr.innerHTML = `
        <td class="codigo">${a.codigo}</td>
        <td>${a.tipo_activo || 'No consta'}</td>
        <td>${[a.marca, a.modelo].filter(Boolean).join(' ') || 'No consta'}</td>
        <td>${a.responsable_actual || 'No consta'}</td>
        <td><span class="estado-pill ${esBaja?'baja':''}">${a.estado || 'No consta'}</span></td>
        <td class="row-actions">
          <button onclick="editarActivo('${a.id}')">Editar</button>
          <button class="qr" onclick="abrirQr('${a.id}')">QR</button>
        </td>`;
      tbody.appendChild(tr);
    }
  }

  function abrirModal(){
    document.getElementById('form-title').textContent = 'Nuevo activo';
    document.getElementById('activo-form').reset();
    document.getElementById('f-id').value = '';
    document.getElementById('btn-eliminar').style.display = 'none';
    document.getElementById('form-overlay').classList.add('show');
  }
  function cerrarModal(){ document.getElementById('form-overlay').classList.remove('show'); }

  function editarActivo(id){
    const a = activos.find(x => x.id === id);
    if (!a) return;
    document.getElementById('form-title').textContent = a.codigo;
    document.getElementById('f-id').value = a.id;
    document.getElementById('f-codigo').value = a.codigo || '';
    document.getElementById('f-tipo').value = a.tipo_activo || '';
    document.getElementById('f-marca').value = a.marca || '';
    document.getElementById('f-modelo').value = a.modelo || '';
    document.getElementById('f-color').value = a.color || '';
    document.getElementById('f-serie').value = a.serie || '';
    document.getElementById('f-responsable').value = a.responsable_actual || '';
    document.getElementById('f-cedula').value = a.cedula_responsable || '';
    document.getElementById('f-ubicacion').value = a.ubicacion || '';
    document.getElementById('f-estado').value = a.estado || 'Asignado';
    document.getElementById('f-fecha').value = a.fecha_ultima_entrega || '';
    document.getElementById('f-proveedor').value = a.proveedor || '';
    document.getElementById('f-factura').value = a.factura || '';
    document.getElementById('f-valor').value = a.valor_compra || '';
    document.getElementById('f-garantia').value = a.garantia || '';
    document.getElementById('f-specs').value = a.especificaciones_tecnicas || '';
    document.getElementById('f-estadofisico').value = a.estado_fisico || '';
    document.getElementById('f-fuente').value = a.fuente || '';
    document.getElementById('f-historial').value = a.historial || '';
    document.getElementById('f-observaciones').value = a.observaciones || '';
    document.getElementById('btn-eliminar').style.display = 'inline-block';
    document.getElementById('form-overlay').classList.add('show');
  }

  document.getElementById('activo-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('f-id').value;
    const payload = {
      codigo: document.getElementById('f-codigo').value.trim().toUpperCase(),
      tipo_activo: document.getElementById('f-tipo').value || null,
      marca: document.getElementById('f-marca').value || null,
      modelo: document.getElementById('f-modelo').value || null,
      color: document.getElementById('f-color').value || null,
      serie: document.getElementById('f-serie').value || null,
      responsable_actual: document.getElementById('f-responsable').value || null,
      cedula_responsable: document.getElementById('f-cedula').value || null,
      ubicacion: document.getElementById('f-ubicacion').value || null,
      estado: document.getElementById('f-estado').value || null,
      fecha_ultima_entrega: document.getElementById('f-fecha').value || null,
      proveedor: document.getElementById('f-proveedor').value || null,
      factura: document.getElementById('f-factura').value || null,
      valor_compra: document.getElementById('f-valor').value || null,
      garantia: document.getElementById('f-garantia').value || null,
      especificaciones_tecnicas: document.getElementById('f-specs').value || null,
      estado_fisico: document.getElementById('f-estadofisico').value || null,
      fuente: document.getElementById('f-fuente').value || null,
      historial: document.getElementById('f-historial').value || null,
      observaciones: document.getElementById('f-observaciones').value || null,
      updated_at: new Date().toISOString(),
    };

    let error;
    if (id){
      ({ error } = await sb.from('activos_fijos').update(payload).eq('id', id));
    } else {
      ({ error } = await sb.from('activos_fijos').insert(payload));
    }
    if (error){ alert('Error al guardar: ' + error.message); return; }
    cerrarModal();
    await cargarActivos();
  });

  async function eliminarActivo(){
    const id = document.getElementById('f-id').value;
    if (!id) return;
    if (!confirm('¿Eliminar este activo permanentemente?')) return;
    const { error } = await sb.from('activos_fijos').delete().eq('id', id);
    if (error){ alert('Error al eliminar: ' + error.message); return; }
    cerrarModal();
    await cargarActivos();
  }

  // ---- QR ----
  let qrActivoActual = null;

  function abrirQr(id){
    const a = activos.find(x => x.id === id);
    if (!a) return;
    qrActivoActual = a;
    document.getElementById('qr-titulo').textContent = a.codigo;
    const url = FICHA_BASE + a.codigo;
    document.getElementById('qr-url').textContent = url;

    const src = document.getElementById('qrcode-src');
    src.innerHTML = '';
    new QRCode(src, { text: url, width: 300, height: 300, correctLevel: QRCode.CorrectLevel.M });

    setTimeout(() => dibujarEtiqueta(a, url), 120);
    document.getElementById('qr-modal').classList.add('show');
  }
  function cerrarQrModal(){ document.getElementById('qr-modal').classList.remove('show'); }

  function dibujarEtiqueta(activo, url){
    const srcCanvas = document.querySelector('#qrcode-src canvas');
    const wrap = document.getElementById('qr-canvas-wrap');
    wrap.innerHTML = '';

    const W = 340, H = 430;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,W,H);

    // franja superior
    ctx.fillStyle = '#14202b';
    ctx.fillRect(0,0,W,56);

    function dibujarTextos(){
      ctx.fillStyle = '#ffffff';
      ctx.font = '600 15px Arial';
      ctx.textAlign = 'left';
      ctx.fillText('ENERGYCONTROL', 16, 34);

      // QR centrado
      const qrSize = 260;
      ctx.drawImage(srcCanvas, (W-qrSize)/2, 76, qrSize, qrSize);

      // código
      ctx.fillStyle = '#14202b';
      ctx.font = '700 24px Consolas, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(activo.codigo, W/2, 368);

      ctx.fillStyle = '#6c8194';
      ctx.font = '12px Arial';
      ctx.fillText([activo.marca, activo.modelo].filter(Boolean).join(' ') || activo.tipo_activo || '', W/2, 390);

      ctx.font = '10px Arial';
      ctx.fillText('Escanea para ver la ficha del activo', W/2, 410);

      wrap.appendChild(canvas);
    }

    if (LOGO_DATA_URL){
      const logo = new Image();
      logo.onload = () => {
        ctx.drawImage(logo, 12, 8, 40, 40);
        dibujarTextos();
      };
      logo.src = LOGO_DATA_URL;
    } else {
      dibujarTextos();
    }
  }

  function descargarQr(){
    const canvas = document.querySelector('#qr-canvas-wrap canvas');
    if (!canvas || !qrActivoActual) return;
    const link = document.createElement('a');
    link.download = `${qrActivoActual.codigo}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  cargarActivos();
</script>
